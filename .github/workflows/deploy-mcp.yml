name: Deploy MCP server

# Deploys the ¡Ñam! MCP server (supabase/functions/mcp) to one Supabase project.
# Manual on purpose, like the migrations: dev first, check, then production.
#
# Secrets it needs (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN      a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF_DEV   the dev project's ref (the subdomain of its URL)
#   SUPABASE_PROJECT_REF_PROD  the production project's ref

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which Supabase project to deploy to
        type: choice
        options: [dev, production]
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Production deploys only from main
        if: inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production is deployed from main. Run this workflow on main."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # The function imports one generated file, bundled from src/mcp/.
      - run: npm run build:mcp

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt: assistants must reach the OAuth discovery document and
      # the 401 challenge before they hold a token. The server verifies the
      # token itself on every other request (src/mcp/server.ts).
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.environment == 'production' && secrets.SUPABASE_PROJECT_REF_PROD || secrets.SUPABASE_PROJECT_REF_DEV }}
        run: supabase functions deploy mcp --no-verify-jwt --project-ref "$PROJECT_REF"
